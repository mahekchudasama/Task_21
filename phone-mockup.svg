<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720">
  <!-- phone body -->
  <rect x="4" y="4" width="352" height="712" rx="46" fill="#1c1c1c"/>
  <rect x="14" y="14" width="332" height="692" rx="36" fill="#0d0d0d"/>
  <!-- screen -->
  <rect x="22" y="60" width="316" height="600" rx="6" fill="#fdf2e9"/>
  <!-- notch -->
  <rect x="140" y="20" width="80" height="16" rx="8" fill="#1c1c1c"/>

  <!-- app content: dark food image with logo -->
  <rect x="22" y="60" width="316" height="380" fill="#2a1c12"/>
  <circle cx="180" cy="220" r="240" fill="#3c2a1a"/>
  <ellipse cx="180" cy="260" rx="120" ry="70" fill="#7a4a2d"/>
  <g stroke="#6a8f4d" stroke-width="10" stroke-linecap="round">
    <line x1="230" y1="170" x2="300" y2="240"/>
    <line x1="250" y1="160" x2="320" y2="230"/>
  </g>

  <!-- circular logo badge -->
  <circle cx="180" cy="250" r="46" fill="none" stroke="#ffffff" stroke-width="3"/>
  <g fill="#ffffff">
    <rect x="163" y="232" width="2.4" height="20" rx="1.2"/>
    <rect x="168" y="232" width="2.4" height="20" rx="1.2"/>
    <rect x="173" y="232" width="2.4" height="20" rx="1.2"/>
    <path d="M162 252 h13 c0 5 -3 8 -3 12 v14 h-7 v-14 c0 -4 -3 -7 -3 -12 z"/>
    <path d="M197 232 c5 0 8 4 8 10 c0 7 -3 10 -6 11 v25 h-5 v-25 c0 -8 0 -16 3 -21 z"/>
  </g>

  <!-- text lines mimicking app UI -->
  <rect x="42" y="460" width="180" height="18" rx="4" fill="#3a2a1c"/>
  <rect x="42" y="488" width="260" height="12" rx="4" fill="#cfc3b6"/>
  <rect x="42" y="508" width="220" height="12" rx="4" fill="#cfc3b6"/>

  <rect x="42" y="550" width="130" height="40" rx="20" fill="#e67e22"/>
  <rect x="182" y="550" width="130" height="40" rx="20" fill="none" stroke="#e67e22" stroke-width="2"/>

  <!-- home indicator -->
  <rect x="150" y="690" width="60" height="6" rx="3" fill="#1c1c1c"/>
</svg>
